<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>구독 신청 - SubTrack</title>
</head>
<body>
<section class="container" style="max-width: 600px; margin: 0 auto; padding: var(--space-xl) var(--space-md);">
    <div class="page-header" style="text-align: center; margin-bottom: var(--space-xl);">
        <h1 class="page-title">새로운 구독 시작</h1>
        <p class="page-subtitle">선택하신 플랜의 정보를 확인하고 구독을 시작하세요.</p>
    </div>

    <div class="card" style="padding: var(--space-xl);">
        <!-- 플랜 요약 정보 -->
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: var(--space-xl); padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
            <div class="service-icon" style="width: 64px; height: 64px; background: var(--primary-soft); color: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800;"
                 th:text="${#strings.substring(plan.name, 0, 1)}">S</div>
            <div>
                <h2 style="font-size: 22px; font-weight: 800; margin: 0;" th:text="${plan.name}">서비스명</h2>
                <span class="badge badge-primary" style="margin-top: 5px;" th:text="${plan.category}">카테고리</span>
            </div>
        </div>

        <form th:action="@{/subscribe}" method="post">
            <input type="hidden" name="planId" th:value="${plan.id}" />
            
            <div class="form-group">
                <label for="startDate">구독 시작일</label>
                <input type="date" id="startDate" name="startDate" class="form-control" 
                       th:value="${#calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}" required />
            </div>

            <div class="form-group" style="margin-bottom: var(--space-lg);">
                <label>결제 주기 및 가격</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;">
                    <label class="card" style="margin: 0; padding: 15px; cursor: pointer; border-color: var(--primary); background: var(--primary-soft);">
                        <input type="radio" name="billingCycle" value="MONTHLY" checked style="margin-bottom: 8px; accent-color: var(--primary);">
                        <strong style="display: block; font-size: 14px; color: var(--primary);">월간 결제</strong>
                        <span style="font-size: 16px; font-weight: 800; color: var(--text-main);" th:text="${#numbers.formatCurrency(plan.monthlyPrice)}">₩0</span>
                    </label>
                    <label class="card" style="margin: 0; padding: 15px; cursor: pointer;">
                        <input type="radio" name="billingCycle" value="YEARLY" style="margin-bottom: 8px; accent-color: var(--primary);">
                        <strong style="display: block; font-size: 14px;">연간 결제</strong>
                        <span style="font-size: 16px; font-weight: 800; color: var(--text-main);" th:text="${#numbers.formatCurrency(plan.yearlyPrice)}">₩0</span>
                    </label>
                </div>
            </div>

            <!-- 약관 동의 -->
            <div class="terms-area" style="margin-bottom: var(--space-xl); font-size: 14px; color: var(--text-muted);">
                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer;">
                    <input type="checkbox" required style="margin-top: 4px; accent-color: var(--primary);">
                    <span>(필수) 서비스 이용약관 및 개인정보 수집 이용에 동의하며, 위 서비스의 사용량을 SubTrack에서 기록하는 것에 동의합니다.</span>
                </label>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; font-size: 16px;">
                구독 신청 완료
            </button>
            <a th:href="@{/}" class="btn-ghost" style="width: 100%; padding: 16px; margin-top: 10px; text-decoration: none; display: block; text-align: center;">취소</a>
        </form>
    </div>
</section>
</body>
</html>
