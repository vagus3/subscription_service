<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">SubTrack</title>

    <link rel="stylesheet" th:href="@{/assets/main.css}">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header th:replace="~{fragments/header :: header}"></header>

        <div class="topbar">
            <input class="search-box" type="search" placeholder="Search subscriptions..." aria-label="Search">
            <div class="topbar-actions">
                <span aria-hidden="true">♧</span>
                <span aria-hidden="true">?</span>
                <span class="avatar" aria-hidden="true"></span>
                <span sec:authorize="isAuthenticated()" sec:authentication="name">Alex Rivera</span>
                <span sec:authorize="!isAuthenticated()">Guest</span>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav th:replace="~{fragments/nav :: nav}"></nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <section th:replace="${content}"></section>
        </main>
        
        <!-- Footer -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
    
    <script th:src="@{/assets/main.js}"></script>
</body>
</html>
