<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>로그인 - SubTrack</title></head>
<body>
<section class="login-container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: var(--space-md);">
  <div class="login-card card" style="width: 100%; max-width: 440px; padding: var(--space-xl);">

    <div class="login-logo" style="display: flex; align-items: center; gap: 10px; margin-bottom: var(--space-sm);">
      <div class="login-logo-icon" style="width: 40px; height: 40px; background: var(--primary); border-radius: var(--radius-small); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px;">S</div>
      <span class="login-logo-text" style="font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.05em;">SubTrack</span>
    </div>
    <p class="login-subtitle" style="font-size: 13px; color: var(--text-muted); margin-bottom: var(--space-lg);">사용량 기반 구독 관리 서비스</p>

    <h2 class="login-title" style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">다시 오셨군요!</h2>
    <p class="login-desc" style="color: var(--text-muted); margin-bottom: var(--space-lg); font-size: 15px;">스마트한 구독 관리를 시작하세요.</p>

    <!-- 로그인 실패 에러 -->
    <div class="alert-error badge-danger" th:if="${param.error}" style="width: 100%; padding: 12px; border-radius: var(--radius-small); margin-bottom: var(--space-md); display: flex; align-items: center; gap: 8px; font-size: 13px;">
      <i class="bi bi-exclamation-circle-fill"></i>
      이메일 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">이메일 주소</label>
        <input type="email" id="username" name="username" class="form-control"
               placeholder="example@subtrack.com" required autocomplete="email" />
      </div>

      <div class="form-group" style="margin-bottom: var(--space-md);">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="비밀번호를 입력하세요" required autocomplete="current-password" />
      </div>

      <div class="login-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); font-size: 14px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" name="remember-me" style="width: 16px; height: 16px; accent-color: var(--primary);">
          로그인 유지
        </label>
        <a th:href="@{/member/forgot}" style="color: var(--primary); font-weight: 600; text-decoration: none;">비밀번호 찾기</a>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;">로그인</button>
    </form>

    <div class="login-divider" style="display: flex; align-items: center; gap: 15px; margin: var(--space-lg) 0; color: var(--border-color); font-size: 13px;">
      <span style="flex: 1; height: 1px; background: var(--border-color);"></span>
      <span style="color: var(--text-muted);">또는</span>
      <span style="flex: 1; height: 1px; background: var(--border-color);"></span>
    </div>

    <p class="login-register" style="text-align: center; font-size: 15px; color: var(--text-muted);">
      아직 계정이 없으신가요?
      <a th:href="@{/join}" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 5px;">무료 회원가입</a>
    </p>

  </div>
</section>
</body>
    <p class="login-subtitle">Premium Plan</p>

    <p class="login-title">다시 오셨군요!</p>
    <p class="login-desc">구독 현황을 확인하고 스마트하게 관리하세요.</p>

    <!-- 로그인 실패 에러 -->
    <div class="alert-error" th:if="${param.error}">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      이메일 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">이메일</label>
        <input type="email" id="username" name="username"
               placeholder="alex@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password"
               placeholder="비밀번호를 입력하세요" required autocomplete="current-password" />
      </div>

      <div class="login-options">
        <label>
          <input type="checkbox" name="remember-me" />
          로그인 상태 유지
        </label>
        <a th:href="@{/member/forgot}">비밀번호 찾기</a>
      </div>

      <button type="submit" class="btn-login">로그인</button>
    </form>

    <div class="login-divider">또는</div>

    <p class="login-register">
      아직 계정이 없으신가요?
      <a th:href="@{/join}">무료로 시작하기</a>
    </p>

  </div>
</div>

</section>
</body>
</html>
