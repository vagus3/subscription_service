<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head><title>회원가입 - SubTrack</title></head>
<body>
<section class="join-wrapper" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: var(--space-md);">
  <div class="join-card card" style="width: 100%; max-width: 480px; padding: var(--space-xl);">

    <div class="join-logo" style="display: flex; align-items: center; gap: 10px; margin-bottom: var(--space-sm);">
      <div class="join-logo-icon" style="width: 40px; height: 40px; background: var(--primary); border-radius: var(--radius-small); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px;">S</div>
      <span class="join-logo-text" style="font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.05em;">SubTrack</span>
    </div>

    <div class="step-indicator" style="display: flex; gap: 8px; margin-bottom: var(--space-lg);">
      <div class="step-dot" style="width: 24px; height: 8px; border-radius: 4px; background: var(--primary);"></div>
      <div class="step-dot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--border-color);"></div>
      <div class="step-dot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--border-color);"></div>
    </div>

    <h2 class="join-title" style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">계정 만들기</h2>
    <p class="join-desc" style="color: var(--text-muted); margin-bottom: var(--space-lg); font-size: 15px;">스마트한 구독 관리의 첫 단계입니다.</p>

    <form th:action="@{/join}" method="post" th:object="${memberForm}">

      <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="name">이름</label>
          <input type="text" id="name" th:field="*{name}" class="form-control"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                 placeholder="홍길동" required />
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                 placeholder="010-0000-0000" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">이메일 주소</label>
        <input type="email" id="email" th:field="*{email}" class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
               placeholder="alex@example.com" required />
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" class="form-control"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
               placeholder="8자 이상 입력하세요" required />
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">영문, 숫자, 특수문자 포함 8자 이상</p>
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-lg);">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="form-control"
               th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"
               placeholder="다시 한번 입력하세요" required />
        <span class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></span>
      </div>

      <!-- 약관 동의 -->
      <div class="terms-group card" style="padding: 15px; background: var(--bg-main); border-radius: var(--radius-small); margin-bottom: var(--space-lg); border: none;">
        <div class="terms-item" style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 700;">
          <input type="checkbox" id="agreeAll" onclick="toggleAll(this)" style="accent-color: var(--primary);">
          <label for="agreeAll">전체 동의</label>
        </div>
        <div class="terms-item" style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px;">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" required style="accent-color: var(--primary);">
          <label for="agreeTerms">(필수) <a th:href="@{/terms}" style="color: var(--primary); text-decoration: none;">이용약관</a> 동의</label>
        </div>
        <div class="terms-item" style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
          <input type="checkbox" id="agreePrivacy" name="agreePrivacy" required style="accent-color: var(--primary);">
          <label for="agreePrivacy">(필수) <a th:href="@{/privacy}" style="color: var(--primary); text-decoration: none;">개인정보 처리방침</a> 동의</label>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;">가입하기</button>

    </form>

    <p class="join-login" style="text-align: center; font-size: 15px; color: var(--text-muted); margin-top: var(--space-lg);">
      이미 계정이 있으신가요? <a th:href="@{/login}" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 5px;">로그인</a>
    </p>

  </div>
</div>

    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <p class="join-title">계정 만들기</p>
    <p class="join-desc">구독을 스마트하게 관리하는 첫 번째 단계입니다.</p>

    <form th:action="@{/join}" method="post" th:object="${memberForm}">

      <div class="form-row">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" th:field="*{name}"
                 th:class="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                 placeholder="홍길동" required />
          <span class="field-error" th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"></span>
        </div>

        <div class="form-group">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" th:field="*{phone}"
                 placeholder="010-0000-0000" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" th:field="*{email}"
               th:class="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
               placeholder="alex@example.com" required />
        <span class="field-error" th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}"
               th:class="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
               placeholder="8자 이상 입력하세요" required />
        <p class="password-hint">영문, 숫자, 특수문자를 포함한 8자 이상</p>
        <span class="field-error" th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}"></span>
      </div>

      <div class="form-group">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
               th:class="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"
               placeholder="비밀번호를 다시 입력하세요" required />
        <span class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}"
              th:errors="*{passwordConfirm}"></span>
      </div>

      <!-- 약관 동의 -->
      <div class="terms-group">
        <div class="terms-item">
          <input type="checkbox" id="agreeAll" onclick="toggleAll(this)" />
          <label for="agreeAll" class="terms-all">전체 동의</label>
        </div>
        <div class="terms-item">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
          <label for="agreeTerms">
            (필수) <a th:href="@{/terms}">이용약관</a>에 동의합니다
          </label>
        </div>
        <div class="terms-item">
          <input type="checkbox" id="agreePrivacy" name="agreePrivacy" required />
          <label for="agreePrivacy">
            (필수) <a th:href="@{/privacy}">개인정보 처리방침</a>에 동의합니다
          </label>
        </div>
        <div class="terms-item">
          <input type="checkbox" id="agreeMarketing" name="agreeMarketing" />
          <label for="agreeMarketing">(선택) 마케팅 정보 수신에 동의합니다</label>
        </div>
      </div>

      <button type="submit" class="btn-join">가입하기</button>

    </form>

    <p class="join-login">
      이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
    </p>

  </div>
</div>

<script>
  function toggleAll(source) {
    const checkboxes = document.querySelectorAll('.terms-group input[type="checkbox"]');
    checkboxes.forEach(cb => cb.checked = source.checked);
  }
</script>

</section>
</body>
</html>
