<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>대체 추천 - SubTrack</title>
</head>
<body>
<section class="container" style="max-width: 1000px; margin: 0 auto; padding: var(--space-xl) var(--space-md);">
    <div class="page-header" style="margin-bottom: var(--space-xl);">
        <h1 class="page-title">스마트 대체 추천</h1>
        <p class="page-subtitle">사용 패턴을 분석하여 비용을 절감할 수 있는 최적의 서비스를 추천해 드립니다.</p>
    </div>

    <!-- 추천 내역이 없을 때 -->
    <div th:if="${#lists.isEmpty(recommendations)}" class="empty-state card" style="text-align: center; padding: 60px 24px;">
        <i class="bi bi-stars" style="font-size: 48px; color: var(--primary); margin-bottom: 20px; display: block;"></i>
        <h3>현재 딱 맞는 추천 항목이 없습니다.</h3>
        <p>더 많은 체크인 데이터가 쌓이면 정확한 분석이 시작됩니다.</p>
    </div>

    <!-- 추천 목록 -->
    <div th:unless="${#lists.isEmpty(recommendations)}" class="recommendation-grid" style="display: grid; gap: var(--space-lg);">
        <div th:each="rec : ${recommendations}" class="recommendation-card card" style="padding: 0; overflow: hidden;">
            <div style="background: linear-gradient(135deg, var(--primary) 0%, #60EFFF 100%); padding: 20px 24px; color: white;">
                <span style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 10px; display: inline-block;">AI 분석 결과</span>
                <h3 style="font-size: 20px; font-weight: 800; margin: 0;" th:text="${rec.title}">추천 제목</h3>
            </div>
            
            <div style="padding: var(--space-lg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-md);">
                <!-- 현재 서비스 -->
                <div style="text-align: center;">
                    <div class="service-icon" style="width: 60px; height: 60px; background: var(--bg-main); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: var(--text-muted); margin: 0 auto 12px;"
                         th:text="${#strings.substring(rec.currentPlan.name, 0, 1)}">C</div>
                    <strong style="display: block; font-size: 16px;" th:text="${rec.currentPlan.name}">현재 서비스</strong>
                    <span style="font-size: 14px; color: var(--danger); font-weight: 700;" th:text="${#numbers.formatCurrency(rec.currentPlan.monthlyPrice)}">₩0</span>
                </div>

                <i class="bi bi-arrow-right" style="font-size: 32px; color: var(--border-color);"></i>

                <!-- 추천 서비스 -->
                <div style="text-align: center;">
                    <div class="service-icon" style="width: 60px; height: 60px; background: var(--primary-soft); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: var(--primary); margin: 0 auto 12px;"
                         th:text="${#strings.substring(rec.recommendedPlan.name, 0, 1)}">R</div>
                    <strong style="display: block; font-size: 16px;" th:text="${rec.recommendedPlan.name}">추천 서비스</strong>
                    <span style="font-size: 14px; color: var(--success); font-weight: 700;" th:text="${#numbers.formatCurrency(rec.recommendedPlan.monthlyPrice)}">₩0</span>
                </div>
            </div>

            <div style="padding: 0 var(--space-lg) var(--space-lg); text-align: center;">
                <div class="badge badge-success" style="font-size: 14px; padding: 8px 16px; border-radius: 12px; margin-bottom: var(--space-md);"
                     th:text="'연간 ' + ${#numbers.formatCurrency(rec.annualSavings)} + ' 절약 가능'">연간 ₩0 절약 가능</div>
                <p style="font-size: 14px; color: var(--text-muted); margin-bottom: var(--space-lg);" th:text="${rec.reason}">추천 사유가 여기에 표시됩니다.</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <a th:href="@{/subscribe(planId=${rec.recommendedPlan.id})}" class="btn-primary" style="padding: 12px 24px; text-decoration: none;">지금 교체하기</a>
                    <button class="btn-ghost" style="padding: 12px 24px;">나중에 하기</button>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
