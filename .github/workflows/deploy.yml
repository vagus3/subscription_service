name: Build and Deploy

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test and package
        run: ./gradlew test bootJar --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: subscription-service
          path: build/libs/*.jar

  deploy-render:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        # secrets 값이 있을 때만 curl 명령어를 실행하도록 셸 스크립트로 처리합니다.
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL이 설정되지 않아 배포를 건너뜁니다."
          fi