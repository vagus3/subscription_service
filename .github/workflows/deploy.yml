name: Build and Deploy

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and package
        run: ./gradlew test bootJar --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: subscription-service
          path: build/libs/*.jar

  deploy-render:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping Render deploy."
            exit 0
          fi

          if [[ "$RENDER_DEPLOY_HOOK_URL" != https://api.render.com/deploy/srv-* ]]; then
            echo "RENDER_DEPLOY_HOOK_URL does not look like a Render deploy hook URL."
            echo "Expected format: https://api.render.com/deploy/srv-...?key=..."
            exit 1
          fi

          http_code="$(curl -sS -o render-response.txt -w "%{http_code}" "$RENDER_DEPLOY_HOOK_URL")"
          echo "Render deploy hook HTTP status: $http_code"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Render deploy hook failed. Response body:"
            cat render-response.txt
            exit 1
          fi

          echo "Render deploy hook accepted."
